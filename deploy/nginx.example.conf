# EXAMPLE ONLY. Merge into the existing nginx configuration after taking a backup.
# Provision and renew certificates before enabling this TLS server block.
server {
    listen 443 ssl;
    server_name studio.stats-max.ru;
    ssl_certificate /etc/letsencrypt/live/studio.stats-max.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.stats-max.ru/privkey.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
