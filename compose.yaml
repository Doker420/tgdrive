services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siteflow
      POSTGRES_USER: siteflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - siteflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteflow -d siteflow"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://siteflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/siteflow
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:?set STUDIO_ORIGIN}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
    ports:
      - "127.0.0.1:7777:7777"
volumes:
  siteflow_db:
